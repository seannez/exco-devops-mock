apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exco-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seannez/exco-devops-mock.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: exco-mock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
