apiVersion: apps/v1
kind: Deployment
metadata:
  name: exco-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: exco-web
  template:
    metadata:
      labels:
        app: exco-web
    spec:
      containers:
        - name: exco-web
          image: exco-mock:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
